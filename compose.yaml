name: douyin-gpt-docker
services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: douyin_assistant
      POSTGRES_USER: douyin_assistant
      POSTGRES_PASSWORD_FILE: /run/secrets/database_password
    secrets:
      - database_password
    ports:
      - "127.0.0.1:${DOUYIN_DATABASE_PORT:-15432}:5432"
    volumes:
      - database-data:/var/lib/postgresql/data
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=40"]
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U douyin_assistant -d douyin_assistant"]
      interval: 10s
      timeout: 3s
      retries: 6
  assistant:
    profiles: ["legacy-assistant"]
    image: douyin-gpt:local
    build:
      context: .
      args:
        CODEX_VERSION: "0.166.0"
    restart: unless-stopped
    environment:
      DOUYIN_DASHBOARD_HOST: "0.0.0.0"
      DOUYIN_DASHBOARD_URL: ${DOUYIN_DASHBOARD_URL:-}
    ports:
      - "${DOUYIN_DASHBOARD_BIND:-127.0.0.1}:${DOUYIN_DASHBOARD_PORT:-3147}:3147"
      - "${DOUYIN_DESKTOP_BIND:-127.0.0.1}:${DOUYIN_DESKTOP_PORT:-6080}:6080"
    volumes:
      - assistant-data:/data
    shm_size: "1gb"
    cpus: 2.0
    mem_limit: 4g
    stop_grace_period: 45s
    security_opt:
      - no-new-privileges:true
volumes:
  assistant-data:
  database-data:
secrets:
  database_password:
    file: ${DOUYIN_DATABASE_PASSWORD_FILE:-./.data/database-password.txt}
